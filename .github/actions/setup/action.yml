name: Setup
description: Python with the pinned tools of requirements-ci.txt, the PlatformIO cache and, when asked, Node for the web app.

inputs:
  node:
    description: Also set up Node with the npm cache of the web app
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-ci.txt

    # The make and just targets read these (Makefile, justfile): a runner has no one else to share it with
    - name: Use every core of the runner at normal priority
      shell: bash
      run: |
        echo "JOBS=$(nproc)" >> "$GITHUB_ENV"
        echo "NICE=0" >> "$GITHUB_ENV"

    - name: Cache PlatformIO toolchains and libraries
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'lib/*/library.json') }}

    - name: Install tools
      shell: bash
      run: pip install -r requirements-ci.txt

    - if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/package-lock.json
