name: Setup
description: Python with the pinned tools of requirements-ci.txt, the PlatformIO cache and, when asked, Node for the web app.

inputs:
  node:
    description: Also set up Node with the npm cache of the web app
    default: "false"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"
        cache: pip
        cache-dependency-path: requirements-ci.txt

    - name: Cache PlatformIO toolchains and libraries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'lib/*/library.json') }}

    - name: Install tools
      shell: bash
      run: pip install -r requirements-ci.txt

    - if: inputs.node == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: "24"
        cache: npm
        cache-dependency-path: web/package-lock.json
