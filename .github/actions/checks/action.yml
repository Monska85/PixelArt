name: Checks
description: Converts the animations, validates them and runs every test suite. Needs the repository checked out. The firmware version is read from git tags, so full history is needed only where the real version matters, as in the release site build.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
      with:
        python-version: "3.12"

    - name: Cache PlatformIO toolchains and libraries
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ~/.platformio
        key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'lib/*/library.json') }}

    - name: Install tools
      shell: bash
      run: pip install platformio pyyaml jsonschema

    - name: Convert animations and playlists, check them against the JSON Schemas
      shell: bash
      run: python tools/pixelart.py build --schema

    - name: Check animations and playlists with the board's engine
      shell: bash
      run: |
        pio run -e native
        .pio/build/native/program --validate

    - name: Run the tests on the simulator
      shell: bash
      run: pio test -e native_test

    - name: Run the tests of the command line client and the release tool
      shell: bash
      run: python -m unittest discover -s tools
