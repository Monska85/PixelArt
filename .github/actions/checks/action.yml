name: Checks
description: Checks the C++ formatting, converts the animations, playlists and schedules, validates them and runs every test suite. Needs the repository checked out. The firmware version is read from git tags, so full history is needed only where the real version matters, as in the release site build.

inputs:
  node:
    description: Also set up Node, for the steps after the checks that build or test the web app
    default: "false"

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup
      with:
        node: ${{ inputs.node }}

    # clang-format is pinned in requirements-ci.txt, so CI formats like a local `make format`
    - name: Check the formatting of the C++ sources
      shell: bash
      run: make format-check

    # The build refuses a schedule with an invalid date or a tie, with or without --schema
    - name: Convert animations, playlists and schedules, check them against the JSON Schemas and check the schedules for ties
      shell: bash
      run: python tools/pixelart.py build --schema

    - name: Check animations, playlists and schedules with the board's engine
      shell: bash
      run: |
        pio run -e native
        .pio/build/native/program --validate

    - name: Run the tests on the simulator
      shell: bash
      run: pio test -e native_test

    - name: Run the tests of the command line client and the release tool
      shell: bash
      run: python -m unittest discover -s tools
