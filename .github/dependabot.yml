version: 2
updates:
  # The actions are pinned to commit SHAs with the version in a comment: Dependabot updates both
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/checks"
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "ci"
      include: "scope"
