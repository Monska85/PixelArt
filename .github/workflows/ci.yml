name: CI

# Every change is checked once: in its pull request, and on main after the merge. A push to a branch with an open
# pull request no longer starts a second, identical run. Releases run their own checks in release.yml.
on:
  push:
    branches: [main]
  pull_request:

# A newer run of the same pull request, or of main, cancels the one still running.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The job only reads the repository and uploads an artifact
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The firmware version comes from git describe
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/checks

      - name: Smoke test the command line client against the simulator
        id: smoke
        run: |
          set -eu
          cp -r data "$RUNNER_TEMP/board-data"
          .pio/build/native/program --data "$RUNNER_TEMP/board-data" --realtime --no-files --loops 0 --ws \
            >/dev/null 2>"$RUNNER_TEMP/simulator.log" &
          simulator=$!
          trap 'kill "$simulator" 2>/dev/null || true' EXIT
          board() { python tools/pixelart.py board --ws ws://127.0.0.1:8765 "$@"; }

          for _ in $(seq 1 30); do
            board info >/dev/null 2>&1 && break
            sleep 1
          done
          board info

          cat > "$RUNNER_TEMP/dot.yaml" <<'EOF'
          format: pixelart/1
          name: Dot
          canvas: {width: 16, height: 16}
          sprites:
            dot:
              points: [[7, 7, "#ff0000"]]
          timeline:
            - show: [dot]
          EOF
          board put "$RUNNER_TEMP/dot.yaml" --kind animation
          board ls --kind animation | grep -q "dot "
          board get dot -o "$RUNNER_TEMP/dot.json"
          test "$(wc -c < "$RUNNER_TEMP/dot.json")" -eq 147
          board rm dot
          if board ls --kind animation | grep -q "dot "; then echo "dot was not deleted"; exit 1; fi

          sed 's/#ff0000/#gren/' "$RUNNER_TEMP/dot.yaml" > "$RUNNER_TEMP/bad.yaml"
          if board put "$RUNNER_TEMP/bad.yaml" --kind animation 2>"$RUNNER_TEMP/bad.log"; then
            echo "a rejected file must give a non-zero exit status"; exit 1
          fi
          cat "$RUNNER_TEMP/bad.log"
          grep -q unknown_color "$RUNNER_TEMP/bad.log"
          if board ls --kind animation | grep -q "bad "; then echo "the rejected file was stored"; exit 1; fi

      - name: Show the simulator log of the failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        run: cat "$RUNNER_TEMP/simulator.log" || true

      # The release site holds the web app too, so it needs Node
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the firmware for every board, the web app and the release site, check its manifest against the JSON Schema
        run: make release-site

      - name: Render previews of every animation
        run: .pio/build/native/program --out sim-out

      - name: Upload previews
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: previews
          path: sim-out/

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cache PlatformIO toolchains and libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.platformio
          key: platformio-${{ runner.os }}-${{ hashFiles('platformio.ini', 'lib/*/library.json') }}

      # The end-to-end tests run against the simulator, and the YAML tests compare with the converted files
      - name: Build the simulator and convert the animations and playlists
        run: |
          pip install platformio pyyaml
          python3 tools/pixelart.py build
          pio run -e native

      - name: Install the web app's dependencies
        working-directory: web
        run: npm ci

      - name: Type check
        working-directory: web
        run: npm run typecheck

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Run the unit tests and the conformance suite
        working-directory: web
        run: npm test

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Check the size of the JavaScript the app loads at start
        working-directory: web
        run: npm run size

      - name: Install Chromium for the end-to-end tests
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run the end-to-end tests and the layout checks against the simulator
        id: e2e
        working-directory: web
        run: npm run e2e

      # The same comparison as `make web-screenshots`, in the official Playwright container. The digest belongs to the
      # version of @playwright/test in web/package.json: the script refuses an image of another version.
      - name: Compare one main state per view with its reference image
        id: screenshots
        env:
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.62.0-noble@sha256:baed2032d533817f3dbe6425de795788430ba345e819a1201337009ba17c9d07
        run: web/scripts/run-screenshots.sh compare

      - name: Upload the end-to-end report and traces
        if: failure() && (steps.e2e.outcome == 'failure' || steps.screenshots.outcome == 'failure')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-test-report
          path: |
            web/playwright-report/
            web/test-results/
            web/playwright-report-layout/
            web/test-results-layout/
            web/playwright-report-screenshots/
            web/test-results-screenshots/
          if-no-files-found: ignore
          retention-days: 7
