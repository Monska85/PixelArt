name: CI

# Every change is checked once: in its pull request, and on main after the merge. A push to a branch with an open
# pull request no longer starts a second, identical run. Releases run their own checks in release.yml.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# The jobs only read the repository and upload artifacts
permissions:
  contents: read

jobs:
  # Which areas a pull request changed, from its list of files in the GitHub API (a renamed file counts under its old
  # and its new name). The API lists at most 3000 files, so a larger pull request sets both outputs to true, as every
  # other event does, a push to main among them: every job runs. check and web also run when this job fails. A job
  # skipped by its if: reports success, so the required checks pass.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      check: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.check == 'true' || steps.filter.outputs.check_web == 'true' }}
      web: ${{ github.event_name != 'pull_request' || github.event.pull_request.changed_files >= 3000 || steps.filter.outputs.web == 'true' }}
    steps:
      # A file counts for a filter when it matches one of its patterns and none of its patterns starting with !
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          predicate-quantifier: some-with-excludes
          # check: everything but the web app and the documentation, which no step of the check job reads.
          # check_web: the files of the web app the check job reads (tools/test_site_url.py).
          # web: everything the steps of the web job read: the web app, the converted content, the simulator's sources
          # and build scripts, the conformance suite, the tools, the license texts the build copies and the CI setup.
          filters: |
            check:
              - '**'
              - '!web/**'
              - '!docs/**'
              - '!*.md'
              - '!certs/README.md'
              - '!conformance/README.md'
            check_web:
              - 'web/src/ui/board/updates.ts'
            web:
              - 'web/**'
              - 'content/**'
              - 'src/**'
              - 'lib/**'
              - 'include/**'
              - 'scripts/**'
              - 'conformance/**'
              - 'schema/**'
              - 'tools/**'
              - 'LICENSES/**'
              - 'LICENSE'
              - 'LICENSE-EXCEPTION'
              - 'Makefile'
              - 'justfile'
              - 'platformio.ini'
              - 'requirements-ci.txt'
              - '.github/**'

  # actionlint checks the workflows, and the run: blocks with the runner's shellcheck
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The release archive of rhysd/actionlint, checked against its SHA-256. Dependabot does not update it: change
      # both values together, the hash from actionlint_<version>_checksums.txt of the same release.
      - name: Lint the workflows
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -eu
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

  # Makes the firmware's certificate bundle again from the pinned esp-idf files (it downloads them) and fails unless it
  # is byte for byte the one in certs/, see certs/README.md
  certificates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Make the certificate bundle again and compare it with certs/
        run: |
          set -eu
          pip install "$(grep '^cryptography==' requirements-ci.txt)"
          python tools/crt_bundle.py check

  check:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.check == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The firmware version comes from git describe
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/checks

      - name: Smoke test the command line client against the simulator
        id: smoke
        run: |
          set -eu
          cp -r data "$RUNNER_TEMP/board-data"
          .pio/build/native/program --data "$RUNNER_TEMP/board-data" --realtime --no-files --loops 0 --ws \
            >/dev/null 2>"$RUNNER_TEMP/simulator.log" &
          simulator=$!
          trap 'kill "$simulator" 2>/dev/null || true' EXIT
          board() { python tools/pixelart.py board --ws ws://127.0.0.1:8765 "$@"; }

          for _ in $(seq 1 30); do
            board info >/dev/null 2>&1 && break
            sleep 1
          done
          board info

          cat > "$RUNNER_TEMP/dot.yaml" <<'EOF'
          format: pixelart/1
          name: Dot
          canvas: {width: 16, height: 16}
          sprites:
            dot:
              points: [[7, 7, "#ff0000"]]
          timeline:
            - show: [dot]
          EOF
          board put "$RUNNER_TEMP/dot.yaml" --kind animation
          board ls --kind animation | grep -q "dot "
          board get dot -o "$RUNNER_TEMP/dot.json"
          test "$(wc -c < "$RUNNER_TEMP/dot.json")" -eq 147
          board rm dot
          if board ls --kind animation | grep -q "dot "; then echo "dot was not deleted"; exit 1; fi

          sed 's/#ff0000/#gren/' "$RUNNER_TEMP/dot.yaml" > "$RUNNER_TEMP/bad.yaml"
          if board put "$RUNNER_TEMP/bad.yaml" --kind animation 2>"$RUNNER_TEMP/bad.log"; then
            echo "a rejected file must give a non-zero exit status"; exit 1
          fi
          cat "$RUNNER_TEMP/bad.log"
          grep -q unknown_color "$RUNNER_TEMP/bad.log"
          if board ls --kind animation | grep -q "bad "; then echo "the rejected file was stored"; exit 1; fi

      - name: Show the simulator log of the failed smoke test
        if: failure() && steps.smoke.conclusion == 'failure'
        run: cat "$RUNNER_TEMP/simulator.log" || true

      # The web job builds the web app; tools/test_release.py covers the merge of the sites
      - name: Build the firmware for every board and the firmware release site, check its manifest against the JSON Schema
        run: make release-firmware

      # A folder outside the repository: release.py replaces site/ and no other folder inside it
      - name: Build the content release site, check its manifest against the JSON Schema, and merge it with the firmware site
        run: |
          set -eu
          make release-content SITE="$RUNNER_TEMP/content-site"
          python tools/release.py assemble --out "$RUNNER_TEMP/assembled" --firmware site --content "$RUNNER_TEMP/content-site" --schema

      - name: Render previews of every animation
        run: .pio/build/native/program --out sim-out

      - name: Upload previews
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: previews
          path: sim-out/

  web:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.web == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node: true

      # The end-to-end tests run against the simulator, and the YAML tests compare with the converted files
      - name: Build the simulator and convert the animations and playlists
        run: |
          python3 tools/pixelart.py build
          pio run -e native

      - name: Install the web app's dependencies
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Check formatting
        working-directory: web
        run: npm run format:check

      - name: Run the unit tests and the conformance suite
        working-directory: web
        run: npm test

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Check the size of the JavaScript the app loads at start
        working-directory: web
        run: npm run size

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./web/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache the Playwright browsers
        id: browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      # The tests run the headless shell only. The runner image already has the system libraries Chromium needs, so
      # apt is not run: Playwright's install-deps adds only optional fonts, and Ubuntu's mirror can take minutes for them.
      - name: Install Chromium for the end-to-end tests
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: web
        run: npx playwright install --only-shell chromium

      - name: Run the end-to-end tests and the layout checks against the simulator
        id: e2e
        working-directory: web
        # Two workers, as before JOBS existed: the end-to-end tests are timing sensitive
        env:
          PIXELART_JOBS: "2"
        run: npm run e2e

      # The same comparison as `make web-screenshots`, in the official Playwright container. The digest belongs to the
      # version of @playwright/test in web/package.json: the script refuses an image of another version.
      - name: Compare one main state per view with its reference image
        id: screenshots
        env:
          PIXELART_JOBS: "2"
          PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:47b510dd9230bf0b9bfc9b20102241e577ea7a99334ab4c3ca19f19770e9b8ea
        run: web/scripts/run-screenshots.sh compare

      - name: Upload the end-to-end report and traces
        if: failure() && (steps.e2e.outcome == 'failure' || steps.screenshots.outcome == 'failure')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-test-report
          path: |
            web/playwright-report/
            web/test-results/
            web/playwright-report-layout/
            web/test-results-layout/
            web/playwright-report-screenshots/
            web/test-results-screenshots/
          if-no-files-found: ignore
          retention-days: 7
