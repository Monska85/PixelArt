name: Release

# release-please keeps two release pull requests open on main, one for the
# firmware (tags vX.Y.Z) and one for the web app (tags web-vX.Y.Z). Merging one
# tags the release; the jobs below then build it and publish its GitHub Release.
# The GitHub Pages site always holds the latest of both, assembled after either
# release. See "Releases" in README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the firmware site, the web app and the assembled site as workflow artifacts and publish nothing
        type: boolean
        default: true

# Jobs that need more declare it
permissions:
  contents: read

jobs:
  # The quick checks on the commit that release-please would release: a main
  # that fails them never gets a tag or a GitHub Release. release-please
  # normally tags this same commit, so the build job runs the checks again only
  # on a workflow_dispatch run or when the tag points to another commit.
  check:
    if: github.event_name == 'push' || (inputs.dry_run == false && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # A web release is gated too: type check, lint and unit tests, the conformance suite included
      - uses: ./.github/actions/checks
        with:
          node: true

      - name: Check the web app
        run: make web-test

  release-please:
    needs: check
    # One release-please run at a time, so two runs never create the same tag or
    # update the release pull request together. A run waiting behind another is
    # replaced by a newer one: that is safe, because release-please reads the
    # state of main itself, and the newest run also releases what an older run
    # would have. Only this job has a group, so the checks and builds of
    # different commits still run side by side. The Pages deployment has its own
    # group below.
    concurrency:
      group: release-please
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # release-please acts with the RELEASE_PLEASE_TOKEN secret, not with this job's token. The secret belongs to the
    # release environment, which only main can use, and no other job uses that environment. Token: README.md, Releases.
    environment: release
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      web_release_created: ${{ steps.release.outputs['web--release_created'] }}
      web_tag_name: ${{ steps.release.outputs['web--tag_name'] }}
      web_version: ${{ steps.release.outputs['web--version'] }}
    steps:
      # Without the secret the action would fall back to the default token: stop instead, and say what to do.
      - name: Check that the release-please token is set
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_PLEASE_TOKEN" ]; then
            echo "::error title=RELEASE_PLEASE_TOKEN is missing::Add RELEASE_PLEASE_TOKEN as a secret of the release environment, a fine-grained token for this repository with Contents, Pull requests and Issues read and write. See Releases in README.md."
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # release-please is skipped on a dry run, which must not stop the build. A manual run that is not a dry run
    # only redeploys Pages and builds nothing unless it released.
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Empty on a dry run: the firmware version then comes from git describe
      PIXELART_VERSION: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.version || '' }}
      RELEASE_TAG: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || '' }}
      # Empty unless the repository sets the variable (a custom domain): the firmware then looks for its manifest at
      # the address GitHub Pages gives the repository (tools/site_url.py)
      PIXELART_SITE_URL: ${{ vars.PIXELART_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}
          # The firmware version comes from git describe
          fetch-depth: 0
          persist-credentials: false

      # On a push, the check job already ran the checks on this run's commit, which is
      # normally the one release-please tagged. A tag on another commit is checked here.
      - id: tagged
        run: echo "checked=$([ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: github.event_name == 'workflow_dispatch' || steps.tagged.outputs.checked != 'true'
        uses: ./.github/actions/checks

      - if: github.event_name != 'workflow_dispatch' && steps.tagged.outputs.checked == 'true'
        uses: ./.github/actions/setup

      - name: Build the firmware release site
        run: make release-firmware

      - name: Check the version of the release
        run: |
          python - <<'EOF'
          import json
          import os

          built = json.load(open("site/manifest.json"))["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag:
              if tag != "v" + built:
                  raise SystemExit(f"the release is {tag} but the firmware is version {built}")
          elif os.environ["PIXELART_VERSION"]:
              raise SystemExit("PIXELART_VERSION is set without a release tag")
          print("release version", built)
          EOF

      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/

  build-web:
    needs: [check, release-please]
    # release-please is skipped on a dry run, which must not stop the build
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.web_release_created == 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run == true)) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.web_release_created == 'true' && needs.release-please.outputs.web_tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the dependencies
        working-directory: web
        run: npm ci

      # The check job already linted this run's commit, which is normally the one release-please tagged. A dry run
      # skips the check job, and a tag on another commit was never linted: both lint here.
      - id: tagged
        run: echo "checked=$([ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Lint
        if: needs.check.result != 'success' || steps.tagged.outputs.checked != 'true'
        working-directory: web
        run: npm run lint

      # npm run build type checks first. The unit and the end-to-end tests run in CI on every pull request and on main.
      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Upload the web app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web
          path: web/dist/

  publish-release:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site

      - name: Attach the site archive, the factory images and the third-party notices to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -eu
          mkdir assets
          # The files and layout of GitHub Pages, so every manifest path resolves inside the archive
          (cd site && zip -q -r -X "../assets/pixelart-site-${VERSION}.zip" .)
          # Release assets live in one flat folder: the board goes into the name
          for file in site/firmware/*/factory-*.bin; do
            board=$(basename "$(dirname "$file")")
            cp "$file" "assets/${board}-$(basename "$file")"
          done
          cp site/firmware/THIRD_PARTY_NOTICES.txt assets/THIRD_PARTY_NOTICES.txt
          gh release upload "$TAG" assets/* --clobber

      # The body comes from the changelog; this line is added once, so a re-run does not repeat it
      - name: Add the source code and licenses line to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
            *"Source code and licenses:"*) exit 0 ;;
          esac
          line="**Source code and licenses:** built from tag \`$TAG\` of $REPOSITORY_URL ($REPOSITORY_URL/tree/$TAG). To build it again, check out the tag and run \`make release-firmware\` (README.md, Releases). GPL-3.0-or-later with the additional permission in LICENSE-EXCEPTION ($REPOSITORY_URL/blob/$TAG/LICENSE, $REPOSITORY_URL/blob/$TAG/LICENSE-EXCEPTION); the third-party notices are THIRD_PARTY_NOTICES.txt, attached here and at firmware/THIRD_PARTY_NOTICES.txt on the site."
          printf '%s\n\n%s\n' "$body" "$line" > notes.md
          gh release edit "$TAG" --notes-file notes.md

  publish-web-release:
    needs: [release-please, build-web]
    if: needs.release-please.outputs.web_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: web

      - name: Attach the web app archive to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.web_tag_name }}
          VERSION: ${{ needs.release-please.outputs.web_version }}
        run: |
          set -eu
          mkdir assets
          # The built app with index.html at the root, ready to be merged into the Pages site
          (cd web && zip -q -r -X "../assets/pixelart-web-${VERSION}.zip" .)
          cp web/THIRD_PARTY_NOTICES.txt assets/THIRD_PARTY_NOTICES.txt
          gh release upload "$TAG" "assets/pixelart-web-${VERSION}.zip" assets/THIRD_PARTY_NOTICES.txt --clobber

      # The body comes from the changelog; this line is added once, so a re-run does not repeat it
      - name: Add the source code and licenses line to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.web_tag_name }}
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -eu
          body=$(gh release view "$TAG" --json body --jq .body)
          case "$body" in
            *"Source code and licenses:"*) exit 0 ;;
          esac
          line="**Source code and licenses:** built from tag \`$TAG\` of $REPOSITORY_URL ($REPOSITORY_URL/tree/$TAG). To build it again, check out the tag and run \`make web-build\` (web/README.md). GPL-3.0-or-later ($REPOSITORY_URL/blob/$TAG/LICENSE); the third-party notices are THIRD_PARTY_NOTICES.txt, attached here and at the root of the site."
          printf '%s\n\n%s\n' "$body" "$line" > notes.md
          gh release edit "$TAG" --notes-file notes.md

  # A Pages deployment replaces the whole site: it always holds the latest firmware release and the latest web
  # release, whichever of the two was just published. A side that failed to build or publish blocks the deployment.
  # A manual run on main that is not a dry run publishes nothing and deploys the site from the latest releases.
  assemble-site:
    needs:
      [release-please, build, build-web, publish-release, publish-web-release]
    if: >-
      ${{ !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.publish-release.result == 'success' || needs.publish-web-release.result == 'success' ||
      (github.event_name == 'workflow_dispatch' && inputs.dry_run == false && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the latest firmware release and the latest web release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The tags of the exact form, highest first, so no other tag, draft or pre-release is ever taken. The
          # pattern goes into a jq string, so its backslashes are doubled.
          tags() {
            gh release list --limit 1000 --exclude-drafts --exclude-pre-releases --json tagName \
              --jq ".[].tagName | select(test(\"${1//\\/\\\\}\"))" | sort -rV
          }
          # The highest of them whose release already carries its archive: another release can still be
          # building, or its publish can have failed
          fetch() {
            # $1 side, $2 tag pattern, $3 tag prefix to strip, $4 archive name prefix
            tag=""
            # Plain assignments: a failed API call stops the job instead of reading as "no release"
            candidates=$(tags "$2")
            for candidate in $candidates; do
              archive="$4-${candidate#"$3"}.zip"
              assets=$(gh release view "$candidate" --json assets --jq '.assets[].name')
              if grep -Fxq "$archive" <<<"$assets"; then
                tag="$candidate"
                break
              fi
              echo "Release $candidate has no $archive yet: skipped."
            done
            if [ -z "$tag" ]; then
              echo "No $1 release with its archive has been published yet: the site goes without it."
              return 0
            fi
            archive="$4-${tag#"$3"}.zip"
            mkdir -p "$RUNNER_TEMP/$1"
            gh release download "$tag" --pattern "$archive" --dir "$RUNNER_TEMP/download-$1"
            unzip -q "$RUNNER_TEMP/download-$1/$archive" -d "$RUNNER_TEMP/$1"
            echo "$1 release $tag unpacked"
          }
          fetch firmware '^v[0-9]+\.[0-9]+\.[0-9]+$' v pixelart-site
          fetch web '^web-v[0-9]+\.[0-9]+\.[0-9]+$' web-v pixelart-web

      - name: Assemble the site
        run: |
          set -eu
          args=""
          for side in firmware web; do
            if [ -d "$RUNNER_TEMP/$side" ]; then args="$args --$side $RUNNER_TEMP/$side"; fi
          done
          # shellcheck disable=SC2086
          python3 tools/release.py assemble --out "$RUNNER_TEMP/site" $args

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy-pages:
    needs: assemble-site
    # A release builds one package, so one build job is always skipped; without this condition the implicit success()
    # would skip the deployment although assemble-site succeeded
    if: ${{ !cancelled() && needs.assemble-site.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      # Empty unless the repository sets the variable (a custom domain): see the build job
      PIXELART_SITE_URL: ${{ vars.PIXELART_SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The firmware looks for its manifest at the site address it was built with (tools/site_url.py). Pages gives
      # the address it will serve this repository at before the deployment: a site that would be served somewhere
      # else stops here, before any board can be left without updates.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Check that Pages will serve the site where the firmware looks for it
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: python3 tools/release.py check-site "$PAGES_URL"

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

      # The same check on the address of the deployment itself, in case Pages served it elsewhere than announced. The
      # site is live by now: a failure cannot stop it, it marks the run as failed for a maintainer to fix and release again.
      - name: Check that the site is served where the firmware looks for it
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tools/release.py check-site "$PAGE_URL"

  assemble-dry-run:
    needs: [build, build-web]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true && needs.build.result == 'success' && needs.build-web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: ${{ runner.temp }}/firmware

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web
          path: ${{ runner.temp }}/web

      - name: Assemble the site
        run: python3 tools/release.py assemble --out "$RUNNER_TEMP/assembled" --firmware "$RUNNER_TEMP/firmware" --web "$RUNNER_TEMP/web"

      - name: Upload the assembled site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-site
          path: ${{ runner.temp }}/assembled
