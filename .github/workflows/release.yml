name: Release

# release-please keeps two release pull requests open on main, one for the
# firmware (tags vX.Y.Z) and one for the web app (tags web-vX.Y.Z). Merging one
# tags the release; the jobs below then build it and publish its GitHub Release.
# The GitHub Pages site always holds the latest of both, assembled after either
# release. See "Releases" in README.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the firmware site, the web app and the assembled site as workflow artifacts and publish nothing
        type: boolean
        default: true

# Every job asks for what it needs on top of this
permissions:
  contents: read

jobs:
  # The quick checks on the commit that release-please would release: a main
  # that fails them never gets a tag or a GitHub Release. The build job runs
  # its own checks again on the tagged commit.
  check:
    if: github.event_name == 'push' || (inputs.dry_run == false && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ./.github/actions/checks

      # A web release is gated too: type check, lint and unit tests, the conformance suite included
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Check the web app
        run: make web-test

  release-please:
    needs: check
    # One release-please run at a time, so two runs never create the same tag or
    # update the release pull request together. A run waiting behind another is
    # replaced by a newer one: that is safe, because release-please reads the
    # state of main itself, and the newest run also releases what an older run
    # would have. Only this job has a group, so the checks and builds of
    # different commits still run side by side. The Pages deployment has its own
    # group below.
    concurrency:
      group: release-please
      cancel-in-progress: false
    # A manual run creates or updates the release only when it is not a dry run, and only on main
    if: github.event_name == 'push' || (inputs.dry_run == false && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      web_release_created: ${{ steps.release.outputs['web--release_created'] }}
      web_tag_name: ${{ steps.release.outputs['web--tag_name'] }}
      web_version: ${{ steps.release.outputs['web--version'] }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4.4.1
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # release-please is skipped on a dry run, which must not stop the build
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Empty on a dry run: the firmware version then comes from git describe
      PIXELART_VERSION: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.version || '' }}
      RELEASE_TAG: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || '' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.release_created == 'true' && needs.release-please.outputs.tag_name || github.sha }}
          # The firmware version comes from git describe
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/checks

      - name: Build the firmware release site
        run: make release-firmware

      - name: Check the version of the release
        run: |
          python - <<'EOF'
          import json
          import os

          built = json.load(open("site/manifest.json"))["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag:
              if tag != "v" + built:
                  raise SystemExit(f"the release is {tag} but the firmware is version {built}")
          elif os.environ["PIXELART_VERSION"]:
              raise SystemExit("PIXELART_VERSION is set without a release tag")
          print("release version", built)
          EOF

      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: site
          path: site/

  build-web:
    needs: release-please
    # release-please is skipped on a dry run, which must not stop the build
    if: >-
      ${{ !cancelled() && needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.web_release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.release-please.outputs.web_release_created == 'true' && needs.release-please.outputs.web_tag_name || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the dependencies
        working-directory: web
        run: npm ci

      # npm run build type checks first. The unit and end-to-end tests run in CI on every push.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build the web app
        working-directory: web
        run: npm run build

      - name: Upload the web app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web
          path: web/dist/

  publish-release:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: site

      - name: Attach the site archive and the factory images to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -eu
          mkdir assets
          # The files and layout of GitHub Pages, so every manifest path resolves inside the archive
          (cd site && zip -q -r -X "../assets/pixelart-site-${VERSION}.zip" .)
          # Release assets live in one flat folder: the board goes into the name
          for file in site/firmware/*/factory-*.bin; do
            board=$(basename "$(dirname "$file")")
            cp "$file" "assets/${board}-$(basename "$file")"
          done
          gh release upload "$TAG" assets/* --clobber

  publish-web-release:
    needs: [release-please, build-web]
    if: needs.release-please.outputs.web_release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web
          path: web

      - name: Attach the web app archive to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.web_tag_name }}
          VERSION: ${{ needs.release-please.outputs.web_version }}
        run: |
          set -eu
          mkdir assets
          # The built app with index.html at the root, ready to be merged into the Pages site
          (cd web && zip -q -r -X "../assets/pixelart-web-${VERSION}.zip" .)
          gh release upload "$TAG" "assets/pixelart-web-${VERSION}.zip" --clobber

  # A Pages deployment replaces the whole site: it always holds the latest firmware release and the latest web
  # release, whichever of the two was just published. A side that failed to build or publish blocks the deployment.
  assemble-site:
    needs:
      [release-please, build, build-web, publish-release, publish-web-release]
    if: >-
      ${{ !cancelled() &&
      !contains(needs.*.result, 'failure') &&
      (needs.publish-release.result == 'success' || needs.publish-web-release.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Download the latest firmware release and the latest web release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The tags of the exact form, highest first, so no other tag, draft or pre-release is ever taken
          tags() {
            gh release list --limit 1000 --json tagName,isDraft,isPrerelease | python3 -I -c '
          import json, re, sys
          pattern = re.compile(sys.argv[1])
          tags = [r["tagName"] for r in json.load(sys.stdin) if not r["isDraft"] and not r["isPrerelease"] and pattern.fullmatch(r["tagName"])]
          for tag in sorted(tags, key=lambda t: tuple(int(n) for n in re.findall(r"[0-9]+", t)), reverse=True):
              print(tag)
          ' "$1"
          }
          # The highest of them whose release already carries its archive: another release can still be
          # building, or its publish can have failed
          fetch() {
            # $1 side, $2 tag pattern, $3 tag prefix to strip, $4 archive name prefix
            tag=""
            # Plain assignments: a failed API call stops the job instead of reading as "no release"
            candidates=$(tags "$2")
            for candidate in $candidates; do
              archive="$4-${candidate#"$3"}.zip"
              assets=$(gh release view "$candidate" --json assets --jq '.assets[].name')
              if grep -Fxq "$archive" <<<"$assets"; then
                tag="$candidate"
                break
              fi
              echo "Release $candidate has no $archive yet: skipped."
            done
            if [ -z "$tag" ]; then
              echo "No $1 release with its archive has been published yet: the site goes without it."
              return 0
            fi
            archive="$4-${tag#"$3"}.zip"
            mkdir -p "$RUNNER_TEMP/$1"
            gh release download "$tag" --pattern "$archive" --dir "$RUNNER_TEMP/download-$1"
            unzip -q "$RUNNER_TEMP/download-$1/$archive" -d "$RUNNER_TEMP/$1"
            echo "$1 release $tag unpacked"
          }
          fetch firmware '^v[0-9]+\.[0-9]+\.[0-9]+$' v pixelart-site
          fetch web '^web-v[0-9]+\.[0-9]+\.[0-9]+$' web-v pixelart-web

      - name: Assemble the site
        run: |
          set -eu
          args=""
          for side in firmware web; do
            if [ -d "$RUNNER_TEMP/$side" ]; then args="$args --$side $RUNNER_TEMP/$side"; fi
          done
          # shellcheck disable=SC2086
          python3 tools/release.py assemble --out "$RUNNER_TEMP/site" $args

      - name: Upload the site for GitHub Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy-pages:
    needs: assemble-site
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

  # A dry run assembles the site from the two builds of this run and publishes nothing
  assemble-dry-run:
    needs: [build, build-web]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.dry_run == true && needs.build.result == 'success' && needs.build-web.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: site
          path: ${{ runner.temp }}/firmware

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web
          path: ${{ runner.temp }}/web

      - name: Assemble the site
        run: python3 tools/release.py assemble --out "$RUNNER_TEMP/assembled" --firmware "$RUNNER_TEMP/firmware" --web "$RUNNER_TEMP/web"

      - name: Upload the assembled site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-site
          path: ${{ runner.temp }}/assembled
