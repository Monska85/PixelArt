          [1, 0], [14, 0], [0, 1], [15, 1], [0, 2], [15, 2], [0, 3], [15, 3], [0, 4], [15, 4], [0, 5],
          [15, 5], [0, 6], [15, 6], [0, 7], [15, 7], [1, 8], [14, 8], [1, 9], [14, 9]
        ]

timeline:
  - show: [mic]
    ms: 600
    recolor: { onair: onair_off }
  - show: [mic, wave0]
    ms: 160
  - show: [mic, wave0, wave1]
    ms: 160
  - show: [mic, wave0, wave1, wave2]
    ms: 160
  - show: [mic]
    ms: 160
  - show: [mic, wave0]
    ms: 160
  - show: [mic, wave0, wave1]
    ms: 160
  - show: [mic, wave0, wave1, wave2]
    ms: 160
  - show: [mic]
    ms: 160
  - show: [mic, wave0]
    ms: 160
  - show: [mic, wave0, wave1]
    ms: 160
  - show: [mic, wave0, wave1, wave2]
    ms: 160
  - show: [mic]
    ms: 160
