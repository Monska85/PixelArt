format: pixelart/1
name: Microphone
version: 1
canvas: { width: 16, height: 16 }

palette:
  grille: "#5a5a68"
  grille_l: "#d0d4e0"
  shine: "#ffffff"
  band: "#ffc020"
  handle: "#2a2a34"
  handle_l: "#4a4a58"
  onair: "#ff2a2a"
  onair_off: "#5a1010"
  stand: "#8a8a96"
  wave: "#3ad0ff"
  wave_d: "#1a5a7a"

sprites:
  mic:
    points:
      shine: [[6, 2], [6, 3]]
      band: [[5, 8], [6, 8], [7, 8], [8, 8], [9, 8], [10, 8]]
      grille_l: [
          [8, 0], [5, 1], [7, 1], [9, 1], [8, 2], [10, 2], [5, 3], [7, 3], [9, 3], [11, 3], [4, 4], [6, 4],
          [8, 4], [10, 4], [5, 5], [7, 5], [9, 5], [6, 6], [8, 6], [10, 6], [7, 7]
        ]
      grille: [
          [7, 0], [6, 1], [8, 1], [10, 1], [5, 2], [7, 2], [9, 2], [4, 3], [8, 3], [10, 3], [5, 4], [7, 4],
          [9, 4], [11, 4], [6, 5], [8, 5], [10, 5], [5, 6], [7, 6], [9, 6], [8, 7]
        ]
      onair: [[8, 10]]
      handle_l: [[6, 9], [6, 10]]
      handle: [[7, 9], [8, 9], [9, 9], [7, 10], [9, 10], [7, 11], [8, 11], [7, 12], [8, 12]]
      stand: [
          [7, 13], [8, 13], [7, 14], [8, 14], [4, 15], [5, 15], [6, 15], [7, 15], [8, 15], [9, 15],
          [10, 15], [11, 15]
        ]
  wave0:
    points:
      wave: [
          [4, 0], [11, 0], [3, 1], [4, 1], [11, 1], [12, 1], [3, 2], [12, 2], [3, 3], [12, 3], [3, 4],
          [12, 4], [3, 5], [12, 5], [3, 6], [12, 6], [3, 7], [4, 7], [11, 7], [12, 7], [4, 8], [11, 8]
        ]
  wave1:
