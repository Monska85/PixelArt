      wave: [
          [2, 0], [3, 0], [12, 0], [13, 0], [2, 1], [13, 1], [1, 2], [14, 2], [1, 3], [14, 3], [1, 4],
          [14, 4], [1, 5], [14, 5], [1, 6], [14, 6], [2, 7], [13, 7], [2, 8], [3, 8], [12, 8], [13, 8],
          [3, 9], [12, 9]
        ]
  wave2:
