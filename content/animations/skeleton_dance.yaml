format: pixelart/1
name: Skeleton Dance
version: 1
canvas: { width: 16, height: 16 }
frame_ms: 220

palette:
  bone: "#f6f2e4"
  eye: "#3a2340"
  cheek: "#ff8fb0"
  smile: "#3a2340"
  dot_a: "#ff7ac8"
  dot_b: "#5ce0ff"
  dot_c: "#ffe066"

sprites:
  head:
    points:
      bone: [
          [2, 0], [3, 0], [4, 0], [5, 0], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [6, 1],
          [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2], [6, 2], [7, 2], [0, 3], [1, 3],
          [3, 3], [4, 3], [6, 3], [7, 3], [0, 4], [2, 4], [3, 4], [4, 4], [5, 4], [7, 4],
          [0, 5], [1, 5], [3, 5], [4, 5], [6, 5], [7, 5], [1, 6], [2, 6], [5, 6], [6, 6]]
      eye: [[2, 3], [5, 3]]
      cheek: [[1, 4], [6, 4]]
      smile: [[2, 5], [5, 5], [3, 6], [4, 6]]
  torso:
    points:
      bone: [
          [2, 0], [3, 0], [0, 1], [1, 1], [2, 1], [3, 1], [4, 1], [5, 1], [2, 2], [3, 2],
          [1, 3], [2, 3], [3, 3], [4, 3], [2, 4], [3, 4], [1, 5], [2, 5], [3, 5], [4, 5]]
  arms_up:
    points:
      bone: [[0, 0], [7, 0], [0, 1], [7, 1], [1, 2], [6, 2]]
  arms_out:
    points:
      bone: [[0, 1], [7, 1], [0, 2], [7, 2]]
  arms_wave:
    points:
      bone: [[0, 0], [0, 1], [7, 1], [1, 2], [7, 2], [7, 3]]
  arms_down:
    points:
      bone: [[1, 1], [6, 1], [0, 2], [7, 2], [0, 3], [7, 3]]
  legs_stand:
    points:
      bone: [[2, 0], [5, 0], [2, 1], [5, 1], [1, 2], [2, 2], [5, 2], [6, 2]]
  legs_kick_r:
    points:
      bone: [[2, 0], [5, 0], [2, 1], [6, 1], [7, 1], [1, 2], [2, 2]]
  legs_kick_l:
    points:
      bone: [[2, 0], [5, 0], [0, 1], [1, 1], [5, 1], [5, 2], [6, 2]]
  legs_bend:
    points:
      bone: [[1, 0], [6, 0], [0, 1], [7, 1], [0, 2], [1, 2], [6, 2], [7, 2]]
  dots_a:
    points:
      dot_a: [[0, 0], [15, 9]]
      dot_b: [[15, 0]]
      dot_c: [[0, 9]]
  dots_b:
    points:
      dot_a: [[0, 9]]
      dot_b: [[0, 0], [15, 9]]
      dot_c: [[15, 0]]

timeline:
  - loop: 3
    steps:
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_down, at: [4, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_out, at: [4, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_kick_r, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_up, at: [4, 6] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_out, at: [4, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_kick_l, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_up, at: [4, 6] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_out, at: [4, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_bend, at: [4, 13] }, { sprite: torso, at: [5, 8] }, { sprite: arms_down, at: [4, 8] }, { sprite: head, at: [4, 1] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_up, at: [4, 6] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_stand, at: [3, 13] }, { sprite: torso, at: [4, 7] }, { sprite: arms_wave, at: [3, 7] }, { sprite: head, at: [2, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [2, 13] }, { sprite: torso, at: [3, 7] }, { sprite: arms_wave, at: [2, 7] }, { sprite: head, at: [2, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_stand, at: [3, 13] }, { sprite: torso, at: [4, 7] }, { sprite: arms_wave, at: [3, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_out, at: [4, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_stand, at: [5, 13] }, { sprite: torso, at: [6, 7] }, { sprite: arms_wave, at: [5, 7] }, { sprite: head, at: [6, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_stand, at: [6, 13] }, { sprite: torso, at: [7, 7] }, { sprite: arms_wave, at: [6, 7] }, { sprite: head, at: [6, 0] }]
      - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_stand, at: [5, 13] }, { sprite: torso, at: [6, 7] }, { sprite: arms_wave, at: [5, 7] }, { sprite: head, at: [4, 0] }]
      - show: [{ sprite: dots_b, at: [0, 3] }, { sprite: legs_bend, at: [4, 13] }, { sprite: torso, at: [5, 8] }, { sprite: arms_down, at: [4, 8] }, { sprite: head, at: [4, 1] }]
  - show: [{ sprite: dots_a, at: [0, 3] }, { sprite: legs_stand, at: [4, 13] }, { sprite: torso, at: [5, 7] }, { sprite: arms_up, at: [4, 6] }, { sprite: head, at: [4, 0] }]
    ms: 600
