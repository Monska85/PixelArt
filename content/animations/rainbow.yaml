format: pixelart/1
name: Rainbow After the Rain
version: 1
canvas: { width: 16, height: 16 }
frame_ms: 300

palette:
  cloud: "#f2f4f8"
  rain_cloud: "#8a93a6"
  drop: "#5fb8ff"
  sun: "#ffd23f"
  red: "#ff3b30"
  orange: "#ff9500"
  yellow: "#ffe14d"
  green: "#34c759"
  blue: "#2f7bff"
  purple: "#9b51e0"

sprites:
  cloud:
    points:
      cloud: [
          [5, 1], [6, 1], [7, 1], [8, 1], [3, 2], [4, 2], [5, 2], [6, 2], [7, 2], [8, 2], [9, 2], [10, 2],
          [2, 3], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3], [10, 3], [11, 3], [12, 3],
          [13, 3], [1, 4], [2, 4], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4],
          [11, 4], [12, 4], [13, 4], [14, 4], [2, 5], [3, 5], [4, 5], [5, 5], [6, 5], [7, 5], [8, 5],
          [9, 5], [10, 5], [11, 5], [12, 5], [13, 5]
        ]
  drops:
    points:
      drop: [[3, 6], [9, 6], [6, 8], [12, 8], [4, 10], [11, 10], [8, 12], [3, 13], [14, 13], [2, 15], [7, 15]]
  sun:
    at: [10, 0]
    points:
      sun: [
          [2, 0], [4, 0], [1, 1], [2, 1], [3, 1], [4, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [5, 2],
          [1, 3], [2, 3], [3, 3], [4, 3]
        ]
  end_clouds:
    at: [0, 13]
    points:
      cloud: [
          [0, 0], [1, 0], [14, 0], [15, 0], [0, 1], [1, 1], [2, 1], [3, 1], [12, 1], [13, 1], [14, 1],
          [15, 1], [0, 2], [1, 2], [2, 2], [3, 2], [4, 2], [11, 2], [12, 2], [13, 2], [14, 2], [15, 2]
        ]
  band_red:
    points:
      red: [
          [5, 8], [6, 8], [7, 8], [8, 8], [9, 8], [10, 8], [3, 9], [4, 9], [11, 9], [12, 9], [2, 10],
          [3, 10], [12, 10], [13, 10], [1, 11], [2, 11], [13, 11], [14, 11], [1, 12], [14, 12], [0, 13],
          [15, 13], [0, 14], [15, 14], [0, 15], [15, 15]
        ]
  band_orange:
    points:
      orange: [
          [5, 9], [6, 9], [7, 9], [8, 9], [9, 9], [10, 9], [4, 10], [5, 10], [10, 10], [11, 10], [3, 11],
          [12, 11], [2, 12], [13, 12], [1, 13], [2, 13], [13, 13], [14, 13], [1, 14], [14, 14], [1, 15],
          [14, 15]
        ]
  band_yellow:
    points:
      yellow: [
          [6, 10], [7, 10], [8, 10], [9, 10], [4, 11], [5, 11], [10, 11], [11, 11], [3, 12], [12, 12],
          [3, 13], [12, 13], [2, 14], [13, 14], [2, 15], [13, 15]
        ]
  band_green:
    points:
      green: [
          [6, 11], [7, 11], [8, 11], [9, 11], [4, 12], [5, 12], [10, 12], [11, 12], [4, 13], [11, 13],
          [3, 14], [12, 14], [3, 15], [12, 15]
        ]
  band_blue:
    points:
      blue: [[6, 12], [7, 12], [8, 12], [9, 12], [5, 13], [10, 13], [4, 14], [11, 14], [4, 15], [11, 15]]
  band_purple:
    points:
      purple: [[6, 13], [7, 13], [8, 13], [9, 13], [5, 14], [6, 14], [9, 14], [10, 14], [5, 15], [10, 15]]

timeline:
  - show: [{ sprite: drops, move: [0, 1], wrap: true }, cloud]
    ms: 120
    repeat: 24
    recolor: { cloud: rain_cloud }
  - show: [cloud]
    ms: 400
    recolor: { cloud: rain_cloud }
  - show: [cloud]
    ms: 400
  - show: [{ sprite: cloud, move: [-1, 0] }, sun]
    ms: 90
    repeat: 16
  - show: [sun, band_red, end_clouds]
    ms: 250
  - show: [sun, band_red, band_orange, end_clouds]
    ms: 250
  - show: [sun, band_red, band_orange, band_yellow, end_clouds]
    ms: 250
  - show: [sun, band_red, band_orange, band_yellow, band_green, end_clouds]
    ms: 250
  - show: [sun, band_red, band_orange, band_yellow, band_green, band_blue, end_clouds]
    ms: 250
  - show: [sun, band_red, band_orange, band_yellow, band_green, band_blue, band_purple, end_clouds]
    ms: 250
  - loop: 4
    steps:
      - show: [sun, band_red, band_orange, band_yellow, band_green, band_blue, band_purple, end_clouds]
        ms: 500
      - show: [sun, band_red, band_orange, band_yellow, band_green, band_blue, band_purple, end_clouds]
        ms: 500
        recolor: { sun: yellow }
