format: pixelart/1
name: Purple Cat
version: 1
canvas: { width: 16, height: 16 }
frame_ms: 400

palette:
  fur: "#9b5cff"
  pink: "#ff8fc0"
  eye: "#5cff3a"
  eye_glow: "#d8ff9a"
  whisker: "#ffffff"
  mouth: "#e0b8ff"

sprites:
  cat:
    points:
      fur: [
          [3, 1], [12, 1], [3, 2], [4, 2], [11, 2], [12, 2], [3, 3], [5, 3], [10, 3], [12, 3],
          [2, 4], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [11, 4],
          [12, 4], [13, 4], [2, 5], [3, 5], [4, 5], [5, 5], [6, 5], [7, 5], [8, 5], [9, 5],
          [10, 5], [11, 5], [12, 5], [13, 5], [2, 6], [3, 6], [6, 6], [7, 6], [8, 6], [9, 6],
          [12, 6], [13, 6], [2, 7], [3, 7], [6, 7], [7, 7], [8, 7], [9, 7], [12, 7], [13, 7],
          [2, 8], [3, 8], [4, 8], [5, 8], [6, 8], [9, 8], [10, 8], [11, 8], [12, 8], [13, 8],
          [2, 9], [3, 9], [4, 9], [5, 9], [7, 9], [8, 9], [10, 9], [11, 9], [12, 9], [13, 9],
          [3, 10], [4, 10], [5, 10], [6, 10], [9, 10], [10, 10], [11, 10], [12, 10], [4, 11], [5, 11],
          [6, 11], [7, 11], [8, 11], [9, 11], [10, 11], [11, 11], [3, 12], [4, 12], [5, 12], [6, 12],
          [7, 12], [8, 12], [9, 12], [10, 12], [11, 12], [12, 12], [3, 13], [4, 13], [5, 13], [6, 13],
          [7, 13], [8, 13], [9, 13], [10, 13], [11, 13], [12, 13], [3, 14], [4, 14], [5, 14], [6, 14],
          [7, 14], [8, 14], [9, 14], [10, 14], [11, 14], [12, 14], [3, 15], [4, 15], [6, 15], [7, 15],
          [8, 15], [9, 15], [11, 15], [12, 15]]
      pink: [[4, 3], [11, 3], [7, 8], [8, 8]]
      whisker: [[0, 8], [15, 8], [1, 9], [14, 9]]
      mouth: [[6, 9], [9, 9], [7, 10], [8, 10]]
  eyes:
    points:
      eye: [[4, 6], [5, 6], [10, 6], [11, 6], [4, 7], [5, 7], [10, 7], [11, 7]]
  eyes_closed:
    points:
      eye: [[4, 7], [5, 7], [10, 7], [11, 7]]
  tail_a:
    at: [13, 10]
    points:
      fur: [[2, 0], [1, 1], [0, 2], [0, 3]]
  tail_b:
    at: [13, 10]
    points:
      fur: [[0, 0], [1, 1], [2, 2], [2, 3]]

timeline:
  - loop: 2
    steps:
      - show: [cat, tail_a, eyes]
      - show: [cat, tail_a, eyes]
        recolor: { eye: eye_glow }
      - show: [cat, tail_b, eyes]
        recolor: { eye: eye_glow }
      - show: [cat, tail_b, eyes]
      - show: [cat, tail_a, eyes]
      - show: [cat, tail_a, eyes_closed]
        ms: 200
      - show: [cat, tail_b, eyes]
      - show: [cat, tail_b, eyes]
        recolor: { eye: eye_glow }
