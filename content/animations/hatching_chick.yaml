timeline:
  - show: [egg, nest]
    ms: 1000
  - loop: 2
    steps:
      - show: [{ sprite: egg, at: [-1, 0] }, nest]
        ms: 120
      - show: [{ sprite: egg, at: [1, 0] }, nest]
        ms: 120
  - show: [egg, crack_small, nest]
    ms: 700
  - loop: 3
    steps:
      - show: [{ sprite: egg, at: [-1, 0] }, { sprite: crack_small, at: [-1, 0] }, nest]
        ms: 100
      - show: [{ sprite: egg, at: [1, 0] }, { sprite: crack_small, at: [1, 0] }, nest]
        ms: 100
  - show: [egg, crack_full, nest]
    ms: 600
  - show: [chick, bottom, { sprite: top, at: [0, -2] }, nest]
    ms: 250
  - show: [{ sprite: chick, at: [0, -1] }, bottom, { sprite: top, at: [0, -5] }, nest]
    ms: 900
  - loop: 3
    steps:
      - show: [{ sprite: chick, at: [0, -1] }, { sprite: chirp, at: [0, -1] }, bottom, { sprite: top, at: [0, -5] }, nest]
        ms: 200
      - show: [{ sprite: chick, at: [0, -1] }, bottom, { sprite: top, at: [0, -5] }, nest]
        ms: 400
  - show: [{ sprite: chick, at: [0, -1] }, bottom, { sprite: top, at: [0, -5] }, nest]
    ms: 1200
