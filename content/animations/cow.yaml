format: pixelart/1
name: Cow
version: 1
canvas: { width: 16, height: 16 }

palette:
  white: "#f5f5f5"
  patch: "#202028"
  horn: "#e0d0a0"
  ear: "#d8d8e0"
  ear_in: "#ffb0c0"
  muzzle: "#ffb0c0"
  nostril: "#a05060"
  mouth: "#a05060"
  eye: "#000000"

sprites:
  cow:
    points:
      horn: [[2, 2], [3, 2], [12, 2], [13, 2], [3, 3], [12, 3]]
      white: [
          [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3], [10, 3], [11, 3], [3, 4], [4, 4], [5, 4], [9, 4],
          [10, 4], [11, 4], [12, 4], [3, 5], [4, 5], [9, 5], [10, 5], [11, 5], [12, 5], [3, 6], [4, 6],
          [5, 6], [8, 6], [9, 6], [10, 6], [11, 6], [12, 6], [3, 7], [4, 7], [6, 7], [7, 7], [8, 7],
          [9, 7], [10, 7], [12, 7], [13, 7], [3, 8], [4, 8], [6, 8], [7, 8], [8, 8], [9, 8], [10, 8],
          [3, 9], [4, 9], [5, 9], [6, 9], [7, 9], [8, 9], [9, 9], [10, 9], [13, 9]
        ]
      ear: [
          [0, 4], [1, 4], [2, 4], [13, 4], [14, 4], [15, 4], [0, 5], [2, 5], [13, 5], [15, 5], [1, 6],
          [2, 6], [13, 6], [14, 6]
        ]
      patch: [
          [6, 4], [7, 4], [8, 4], [5, 5], [6, 5], [7, 5], [8, 5], [6, 6], [7, 6], [12, 8], [13, 8],
          [11, 9], [12, 9]
        ]
      ear_in: [[1, 5], [14, 5]]
      eye: [[5, 7], [11, 7], [5, 8], [11, 8]]
      muzzle: [
          [3, 10], [4, 10], [5, 10], [6, 10], [7, 10], [8, 10], [9, 10], [10, 10], [11, 10], [12, 10],
          [2, 11], [3, 11], [4, 11], [7, 11], [8, 11], [11, 11], [12, 11], [13, 11], [2, 12], [3, 12],
          [4, 12], [5, 12], [6, 12], [7, 12], [8, 12], [9, 12], [10, 12], [11, 12], [12, 12], [13, 12],
          [3, 13], [4, 13], [5, 13], [6, 13], [9, 13], [10, 13], [11, 13], [12, 13], [4, 14], [5, 14],
          [6, 14], [7, 14], [8, 14], [9, 14], [10, 14], [11, 14]
        ]
      nostril: [[5, 11], [6, 11], [9, 11], [10, 11]]
      mouth: [[7, 13], [8, 13]]
