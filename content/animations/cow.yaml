      muzzle: [[7, 13], [8, 13]]
      mouth: [[7, 14], [8, 14]]
  flick:
    points:
      ear: [[0, 3], [1, 3]]

timeline:
  - loop: 2
    steps:
      - show: [cow]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow]
        ms: 200
      - show: [cow]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow, chew, flick]
        ms: 200
      - show: [cow, flick]
        ms: 200
      - show: [cow]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow]
        ms: 200
        recolor: { eye: white }
      - show: [cow]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow, chew]
        ms: 200
      - show: [cow]
        ms: 200
