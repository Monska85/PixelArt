  alien_eye: "#000000"
  cannon: "#ffc020"
  barrel: "#fff0a0"
  tread: "#8a6a10"
  shot: "#ffffff"
  boom_y: "#ffe14a"
  boom_o: "#ff6a1a"
  boom_w: "#ffffff"

