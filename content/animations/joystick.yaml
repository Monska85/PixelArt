format: pixelart/1
name: Joystick
version: 1
canvas: { width: 16, height: 16 }

palette:
  case: "#2a2a40"
  case_top: "#4a4a6a"
  edge: "#6a6a90"
  washer: "#101018"
  stick: "#d0d4e0"
  ball: "#e8213a"
  ball_d: "#a01020"
  ball_shine: "#ffb0b0"
  b1: "#ffd23f"
  b1_on: "#fff8d0"
  b2: "#3a8aff"
  b2_on: "#d0e4ff"
  b3: "#5aff6a"
  b3_on: "#e0ffe4"

sprites:
  case:
    points:
      edge: [
          [1, 9], [2, 9], [3, 9], [4, 9], [5, 9], [6, 9], [7, 9], [8, 9], [9, 9], [10, 9], [11, 9],
          [12, 9], [13, 9], [14, 9]
        ]
      case_top: [
          [1, 10], [2, 10], [3, 10], [7, 10], [8, 10], [9, 10], [10, 10], [11, 10], [12, 10], [13, 10],
          [14, 10], [1, 11], [2, 11], [3, 11], [4, 11], [5, 11], [6, 11], [7, 11], [8, 11], [9, 11],
          [10, 11], [11, 11], [12, 11], [13, 11], [14, 11]
        ]
      case: [
          [1, 12], [2, 12], [3, 12], [4, 12], [5, 12], [6, 12], [7, 12], [8, 12], [9, 12], [10, 12],
          [11, 12], [12, 12], [13, 12], [14, 12], [1, 13], [2, 13], [3, 13], [4, 13], [5, 13], [6, 13],
          [7, 13], [8, 13], [9, 13], [10, 13], [11, 13], [12, 13], [13, 13], [14, 13], [1, 14], [2, 14],
          [3, 14], [4, 14], [5, 14], [6, 14], [7, 14], [8, 14], [9, 14], [10, 14], [11, 14], [12, 14],
          [13, 14], [14, 14], [1, 15], [2, 15], [3, 15], [4, 15], [5, 15], [6, 15], [7, 15], [8, 15],
          [9, 15], [10, 15], [11, 15], [12, 15], [13, 15], [14, 15]
        ]
      washer: [[4, 10], [5, 10], [6, 10]]
  buttons:
    points:
      b1: [[8, 10], [9, 10]]
      b2: [[11, 10], [12, 10]]
      b3: [[10, 12], [11, 12]]
  stick_mid:
    points:
      stick: [[5, 9], [5, 8], [5, 7]]
      ball: [
          [4, 2], [5, 2], [6, 2], [3, 3], [5, 3], [6, 3], [7, 3], [3, 4], [4, 4], [5, 4], [6, 4], [7, 4],
          [3, 5], [4, 5], [4, 6]
        ]
      ball_d: [[5, 5], [6, 5], [7, 5], [5, 6], [6, 6]]
      ball_shine: [[4, 3]]
  stick_left:
    points:
      stick: [[5, 9], [4, 8]]
      ball: [
          [1, 3], [2, 3], [3, 3], [0, 4], [2, 4], [3, 4], [4, 4], [0, 5], [1, 5], [2, 5], [3, 5], [4, 5],
          [0, 6], [1, 6], [1, 7]
        ]
      ball_d: [[2, 6], [3, 6], [4, 6], [2, 7], [3, 7]]
      ball_shine: [[1, 4]]
  stick_right:
    points:
      stick: [[5, 9], [6, 8]]
      ball: [
          [7, 3], [8, 3], [9, 3], [6, 4], [8, 4], [9, 4], [10, 4], [6, 5], [7, 5], [8, 5], [9, 5], [10, 5],
          [6, 6], [7, 6], [7, 7]
        ]
      ball_d: [[8, 6], [9, 6], [10, 6], [8, 7], [9, 7]]
      ball_shine: [[7, 4]]
  stick_fwd:
    points:
      stick: [[5, 9], [5, 8], [5, 7], [5, 6]]
      ball: [
          [4, 1], [5, 1], [6, 1], [3, 2], [5, 2], [6, 2], [7, 2], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3],
          [3, 4], [4, 4], [4, 5]
        ]
      ball_d: [[5, 4], [6, 4], [7, 4], [5, 5], [6, 5]]
      ball_shine: [[4, 2]]

timeline:
  - show: [case, buttons, stick_mid]
    ms: 240
  - show: [case, buttons, stick_left]
    ms: 240
  - show: [case, buttons, stick_left]
    ms: 240
    recolor: { b1: b1_on }
  - show: [case, buttons, stick_mid]
    ms: 240
  - show: [case, buttons, stick_right]
    ms: 240
    recolor: { b2: b2_on }
  - show: [case, buttons, stick_right]
    ms: 240
  - show: [case, buttons, stick_mid]
    ms: 240
    recolor: { b3: b3_on }
  - show: [case, buttons, stick_fwd]
    ms: 240
  - show: [case, buttons, stick_fwd]
    ms: 240
    recolor: { b1: b1_on }
  - show: [case, buttons, stick_mid]
    ms: 240
  - show: [case, buttons, stick_left]
    ms: 240
    recolor: { b2: b2_on }
  - show: [case, buttons, stick_mid]
    ms: 240
    recolor: { b3: b3_on }
  - show: [case, buttons, stick_right]
    ms: 240
  - show: [case, buttons, stick_mid]
    ms: 240
  - show: [case, buttons, stick_mid]
    ms: 800
