  - show: [stars, beam_r, tower, { sprite: sea, at: [-8, 14], wrap: true }]
  - show: [stars, beam_r, tower, { sprite: sea, at: [-9, 14], wrap: true }]
  - show: [stars, tower, { sprite: sea, at: [-9, 14], wrap: true }]
    recolor: { lamp: lamp_dim }
  - show: [stars, beam_l, tower, { sprite: sea, at: [-10, 14], wrap: true }]
  - show: [stars, beam_l, tower, { sprite: sea, at: [-10, 14], wrap: true }]
  - show: [stars, beam_l, tower, { sprite: sea, at: [-11, 14], wrap: true }]
  - show: [stars, tower, { sprite: sea, at: [-11, 14], wrap: true }]
    recolor: { lamp: lamp_dim }
  - show: [stars, beam_r, tower, { sprite: sea, at: [-12, 14], wrap: true }]
  - show: [stars, beam_r, tower, { sprite: sea, at: [-12, 14], wrap: true }]
  - show: [stars, beam_r, tower, { sprite: sea, at: [-13, 14], wrap: true }]
  - show: [stars, tower, { sprite: sea, at: [-13, 14], wrap: true }]
    recolor: { lamp: lamp_dim }
  - show: [stars, beam_l, tower, { sprite: sea, at: [-14, 14], wrap: true }]
  - show: [stars, beam_l, tower, { sprite: sea, at: [-14, 14], wrap: true }]
  - show: [stars, beam_l, tower, { sprite: sea, at: [-15, 14], wrap: true }]
  - show: [stars, tower, { sprite: sea, at: [-15, 14], wrap: true }]
