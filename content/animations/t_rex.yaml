format: pixelart/1
name: T-Rex
version: 1
canvas: { width: 16, height: 16 }

palette:
  skin: "#4caf50"
  skin_d: "#2f7a3a"
  belly: "#c8e080"
  eye: "#ffe14a"
  tooth: "#ffffff"
  arm: "#3a8a40"
  claw: "#ffffff"
  mouth: "#801818"
  roar: "#ffffff"

sprites:
  head:
    points:
      skin: [
          [8, 1], [9, 1], [10, 1], [11, 1], [12, 1], [13, 1], [7, 2], [8, 2], [9, 2], [10, 2], [11, 2],
          [13, 2], [14, 2], [7, 3], [8, 3], [9, 3], [10, 3], [11, 3], [12, 3], [13, 3], [14, 3], [15, 3],
          [7, 4], [8, 4], [9, 4], [10, 4], [12, 4], [14, 4]
        ]
      eye: [[12, 2]]
      tooth: [[11, 4], [13, 4], [15, 4]]
  jaw:
    points:
      skin: [
          [7, 5], [8, 5], [9, 5], [10, 5], [12, 5], [14, 5], [6, 6], [7, 6], [8, 6], [9, 6], [10, 6],
          [11, 6], [12, 6], [13, 6]
        ]
      tooth: [[11, 5], [13, 5]]
  body:
    points:
      skin: [
          [5, 7], [6, 7], [7, 7], [8, 7], [9, 7], [10, 7], [4, 8], [5, 8], [6, 8], [7, 8], [8, 8], [9, 8],
          [2, 9], [3, 9], [4, 9], [5, 9], [6, 9], [7, 9], [8, 9], [9, 9], [1, 10], [2, 10], [3, 10],
          [4, 10], [7, 10], [8, 10], [0, 11], [1, 11], [2, 11], [4, 11], [5, 11], [7, 11], [8, 11],
          [0, 12], [5, 12], [6, 12], [8, 12], [9, 12], [5, 13], [6, 13], [9, 13], [4, 14], [5, 14],
          [6, 14], [8, 14], [9, 14], [10, 14]
        ]
      arm: [[10, 8], [11, 8], [11, 9]]
      claw: [[12, 9]]
      belly: [[5, 10], [6, 10], [6, 11]]
  mouth:
    points:
      mouth: [[9, 5], [10, 5], [11, 5], [12, 5], [13, 5], [14, 5], [9, 6], [10, 6], [11, 6], [12, 6], [13, 6]]
  roar:
    points:
      roar: [[15, 4], [15, 6], [15, 8]]
  stripes:
    points:
      skin_d: [[9, 1], [11, 2], [5, 9], [3, 10], [7, 11]]

timeline:
  - loop: 2
    steps:
      - show: [body, head, jaw, stripes]
        ms: 1200
      - show: [body, head, jaw, stripes]
        ms: 150
        recolor: { eye: skin }
      - show: [body, head, jaw, stripes]
        ms: 600
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes, roar]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes, roar]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes, roar]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes]
        ms: 140
      - show: [body, mouth, head, { sprite: jaw, at: [0, 2] }, stripes, roar]
        ms: 140
      - show: [body, head, jaw, stripes]
        ms: 900
