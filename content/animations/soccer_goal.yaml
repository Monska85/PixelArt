format: pixelart/1
name: Soccer Goal
version: 1
canvas: { width: 16, height: 16 }

palette:
  post: "#ffffff"
  net: "#6a7080"
  net_push: "#a8b0c0"
  grass: "#3fa34d"
  grass_dark: "#2b7a37"
  ball: "#f5f5f5"
  patch: "#3a3a44"
  c1: "#ff3b30"
  c2: "#ffd23f"
  c3: "#2f7bff"
  c4: "#ff6fb0"

sprites:
  goal:
    points:
      post: [
          [11, 3], [11, 4], [11, 5], [11, 6], [11, 7], [11, 8], [11, 9], [11, 10], [11, 11], [11, 12],
          [12, 3], [13, 3], [14, 3], [15, 3]
        ]
      net: [
          [12, 4], [12, 6], [12, 8], [12, 10], [12, 12], [13, 5], [13, 7], [13, 9], [13, 11], [14, 4],
          [14, 6], [14, 8], [14, 10], [14, 12], [15, 5], [15, 7], [15, 9], [15, 11]
        ]
  grass:
    points:
      grass: [
          [0, 13], [0, 14], [1, 13], [1, 15], [2, 14], [2, 15], [3, 13], [3, 14], [4, 13], [4, 15],
          [5, 14], [5, 15], [6, 13], [6, 14], [7, 13], [7, 15], [8, 14], [8, 15], [9, 13], [9, 14],
          [10, 13], [10, 15], [11, 14], [11, 15], [12, 13], [12, 14], [13, 13], [13, 15], [14, 14],
          [14, 15], [15, 13], [15, 14]
        ]
      grass_dark: [
          [0, 15], [1, 14], [2, 13], [3, 15], [4, 14], [5, 13], [6, 15], [7, 14], [8, 13], [9, 15],
          [10, 14], [11, 13], [12, 15], [13, 14], [14, 13], [15, 15]
        ]
  ball_a:
    points:
      ball: [[1, 0], [2, 0], [0, 1], [2, 1], [3, 1], [0, 2], [1, 2], [3, 2], [1, 3], [2, 3]]
      patch: [[1, 1], [2, 2]]
  ball_b:
    points:
      ball: [[1, 0], [2, 0], [0, 1], [1, 1], [3, 1], [0, 2], [2, 2], [3, 2], [1, 3], [2, 3]]
      patch: [[2, 1], [1, 2]]
  bulge:
    points:
      net_push: [[15, 5], [15, 6], [15, 7], [15, 8], [15, 9], [15, 10], [14, 6], [14, 8]]
  confetti:
    points:
      c1: [[5, 1], [0, 9], [10, 2]]
      c2: [[3, 7], [2, 10], [10, 9], [7, 6]]
      c3: [[1, 10], [4, 6], [10, 8]]
      c4: [[4, 9], [0, 2], [8, 10], [7, 9]]

timeline:
  - loop: 2
    steps:
      - show: [grass, goal, { sprite: ball_a, at: [0, 9] }]
        ms: 800
      - show: [grass, goal, { sprite: ball_b, at: [0, 9] }]
        ms: 90
      - show: [grass, goal, { sprite: ball_a, at: [2, 7] }]
        ms: 90
      - show: [grass, goal, { sprite: ball_b, at: [4, 6] }]
        ms: 90
      - show: [grass, goal, { sprite: ball_a, at: [6, 5] }]
        ms: 90
      - show: [grass, goal, { sprite: ball_b, at: [8, 5] }]
        ms: 90
      - show: [grass, goal, { sprite: ball_a, at: [10, 6] }]
        ms: 90
      - show: [grass, goal, { sprite: ball_b, at: [12, 7] }]
        ms: 90
      - show: [grass, goal, bulge, { sprite: ball_a, at: [12, 8] }]
        ms: 400
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 0], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 1], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 2], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 3], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 4], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 5], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 6], wrap: true }]
        ms: 150
      - show: [grass, goal, { sprite: ball_a, at: [12, 9] }, { sprite: confetti, at: [0, 7], wrap: true }]
        ms: 150
