format: pixelart/1
name: Cherry Blossom
version: 1
canvas: { width: 16, height: 16 }
frame_ms: 180

palette:
  blossom: "#ffb7d5"
  blossom_dark: "#ff7fb0"
  bark: "#6b4226"
  grass: "#3fa34d"
  petal: "#ffd6e7"

sprites:
  tree:
    at: [0, 3]
    points:
      blossom: [
          [4, 1], [5, 1], [7, 1], [8, 1], [2, 2], [3, 2], [5, 2], [6, 2], [7, 2], [9, 2], [10, 2], [11, 2],
          [1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [7, 3], [8, 3], [9, 3], [11, 3], [12, 3], [1, 4], [3, 4],
          [4, 4], [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [11, 4], [12, 4], [13, 4], [2, 5],
          [3, 5], [4, 5], [6, 5], [7, 5], [8, 5], [10, 5], [11, 5], [12, 5], [13, 5], [3, 6], [4, 6],
          [5, 6], [6, 6], [8, 6], [9, 6], [10, 6], [11, 6], [5, 7], [8, 7], [9, 7], [10, 7]
        ]
      blossom_dark: [[6, 1], [4, 2], [8, 2], [6, 3], [10, 3], [2, 4], [5, 5], [9, 5], [12, 6]]
      bark: [
          [7, 6], [6, 7], [7, 7], [7, 8], [8, 8], [7, 9], [8, 9], [7, 10], [8, 10], [6, 11], [7, 11],
          [8, 11], [9, 11]
        ]
      grass: [
          [0, 12], [1, 12], [2, 12], [3, 12], [4, 12], [5, 12], [6, 12], [7, 12], [8, 12], [9, 12],
          [10, 12], [11, 12], [12, 12], [13, 12], [14, 12], [15, 12]
        ]
  petals:
    points:
      petal: [[5, 15], [0, 5], [0, 4], [8, 8], [6, 13], [8, 6], [3, 5], [12, 8], [3, 9]]

timeline:
  - loop: 3
    steps:
      - show: [tree, { sprite: petals, move: [-1, 1], wrap: true }]
        repeat: 8
      - show: [tree, { sprite: petals, at: [-8, 8], move: [-1, 1], wrap: true }]
        repeat: 8
        recolor: { blossom: blossom_dark, blossom_dark: blossom }
