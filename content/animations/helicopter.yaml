format: pixelart/1
name: Helicopter
version: 1
canvas: { width: 16, height: 16 }

palette:
  body: "#e8213a"
  glass: "#a0d8f0"
  tail: "#c0c4d0"
  mast: "#4a4a54"
  skid: "#8a8a96"
  rotor: "#d0d4e0"
  rotor_d: "#5a5a68"

sprites:
  heli:
    points:
      mast: [[7, 4]]
      body: [
          [5, 5], [6, 5], [7, 5], [8, 5], [9, 5], [10, 5], [4, 6], [5, 6], [6, 6], [7, 6], [8, 6], [4, 7],
          [5, 7], [6, 7], [7, 7], [8, 7], [5, 8], [6, 8], [7, 8], [8, 8], [9, 8], [10, 8], [11, 8],
          [12, 8], [6, 9], [7, 9], [8, 9], [9, 9], [10, 9], [11, 9]
        ]
      tail: [[0, 6], [1, 6], [2, 6], [3, 6], [1, 7]]
      glass: [[9, 6], [10, 6], [11, 6], [9, 7], [10, 7], [11, 7], [12, 7]]
      skid: [
          [7, 10], [11, 10], [4, 11], [5, 11], [6, 11], [7, 11], [8, 11], [9, 11], [10, 11], [11, 11],
          [12, 11], [13, 11]
        ]
  rotor_a:
    points:
      rotor: [
          [0, 3], [1, 3], [2, 3], [3, 3], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3], [10, 3], [11, 3],
          [12, 3], [13, 3], [14, 3], [15, 3]
        ]
  rotor_b:
    points:
      rotor: [[4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3], [10, 3], [11, 3]]
      rotor_d: [[2, 3], [3, 3], [12, 3], [13, 3]]
  tail_a:
    points:
      rotor: [[0, 5], [0, 7], [1, 6]]
  tail_b:
    points:
      rotor: [[0, 6], [1, 5], [1, 7]]

timeline:
  - loop: 4
    steps:
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_b, at: [0, 0] }, { sprite: tail_b, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_a, at: [0, 0] }, { sprite: tail_a, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_b, at: [0, 0] }, { sprite: tail_b, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_a, at: [0, 0] }, { sprite: tail_a, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_b, at: [0, 1] }, { sprite: tail_b, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_a, at: [0, 1] }, { sprite: tail_a, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_b, at: [0, 1] }, { sprite: tail_b, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_a, at: [0, 1] }, { sprite: tail_a, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_b, at: [0, 0] }, { sprite: tail_b, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_a, at: [0, 0] }, { sprite: tail_a, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_b, at: [0, 0] }, { sprite: tail_b, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 0] }, { sprite: rotor_a, at: [0, 0] }, { sprite: tail_a, at: [0, 0] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_b, at: [0, 1] }, { sprite: tail_b, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_a, at: [0, 1] }, { sprite: tail_a, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_b, at: [0, 1] }, { sprite: tail_b, at: [0, 1] }]
        ms: 90
      - show: [{ sprite: heli, at: [0, 1] }, { sprite: rotor_a, at: [0, 1] }, { sprite: tail_a, at: [0, 1] }]
        ms: 90
