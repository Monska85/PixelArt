format: pixelart/1
name: Alarm Clock
version: 1
canvas: { width: 16, height: 16 }

palette:
  bell: "#ffd23f"
  hammer: "#c8c8d0"
  body: "#e0262a"
  face: "#f5f5f5"
  hand: "#202020"
  ring: "#ffe066"

sprites:
  clock:
    at: [0, 1]
    points:
      bell: [
          [2, 0], [3, 0], [12, 0], [13, 0], [1, 1], [2, 1], [3, 1], [4, 1], [11, 1], [12, 1], [13, 1],
          [14, 1], [1, 2], [2, 2], [3, 2], [12, 2], [13, 2], [14, 2]
        ]
      hammer: [[7, 0], [8, 0], [7, 1]]
      body: [
          [5, 2], [6, 2], [7, 2], [8, 2], [9, 2], [10, 2], [4, 3], [5, 3], [6, 3], [7, 3], [8, 3], [9, 3],
          [10, 3], [11, 3], [3, 4], [4, 4], [11, 4], [12, 4], [2, 5], [3, 5], [12, 5], [13, 5], [2, 6],
          [13, 6], [2, 7], [13, 7], [2, 8], [13, 8], [2, 9], [13, 9], [2, 10], [3, 10], [12, 10], [13, 10],
          [3, 11], [4, 11], [11, 11], [12, 11], [4, 12], [5, 12], [6, 12], [7, 12], [8, 12], [9, 12],
          [10, 12], [11, 12], [4, 13], [11, 13], [3, 14], [4, 14], [11, 14], [12, 14]
        ]
      face: [
          [5, 4], [6, 4], [7, 4], [8, 4], [9, 4], [10, 4], [4, 5], [5, 5], [6, 5], [8, 5], [9, 5], [10, 5],
          [11, 5], [3, 6], [4, 6], [5, 6], [6, 6], [8, 6], [9, 6], [10, 6], [11, 6], [12, 6], [3, 7],
          [4, 7], [5, 7], [6, 7], [8, 7], [9, 7], [10, 7], [11, 7], [12, 7], [3, 8], [4, 8], [5, 8],
          [6, 8], [11, 8], [12, 8], [3, 9], [4, 9], [5, 9], [6, 9], [7, 9], [8, 9], [9, 9], [10, 9],
          [11, 9], [12, 9], [4, 10], [5, 10], [6, 10], [7, 10], [8, 10], [9, 10], [10, 10], [11, 10],
          [5, 11], [6, 11], [7, 11], [8, 11], [9, 11], [10, 11]
        ]
      hand: [[7, 5], [7, 6], [7, 7], [7, 8], [8, 8], [9, 8], [10, 8]]
  ring:
    points:
      ring: [[0, 2], [1, 1], [0, 6], [1, 7], [15, 2], [14, 1], [15, 6], [14, 7]]

timeline:
  - show: [clock]
    ms: 1500
  - show: [{ sprite: clock, at: [-1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }, ring]
    ms: 70
  - show: [{ sprite: clock, at: [-1, 1] }]
    ms: 70
  - show: [{ sprite: clock, at: [1, 1] }]
    ms: 70
  - show: [clock]
    ms: 1200
