[platformio]
default_envs = esp32c3

[env]
lib_deps =
    adafruit/Adafruit NeoMatrix@^1.3.3
; Physical panel, used by the live monitor (monitor/filter_pixelart.py)
custom_panel_size = 16x16
custom_panel_layout = top,left,columns,zigzag

; ---- Firmware ----

[esp32_base]
platform = espressif32
framework = arduino
monitor_speed = 115200
; Draws the matrix live when the firmware is built with -DPIXELART_MIRROR (make mirror)
monitor_filters = pixelart
lib_ignore = ArduinoSim
; Animations live in LittleFS, filled from data/ by `make uploadfs`
board_build.filesystem = littlefs
; Same C++ standard as the simulator, for the shared engine
build_unflags = -std=gnu++11
build_flags = -std=gnu++17
; Tests need the simulator: run them with the native_test env
test_ignore = *

; ESP32-C3 SuperMini (the board used by the frame)
[env:esp32c3]
extends = esp32_base
board = esp32-c3-devkitm-1
build_flags =
    ${esp32_base.build_flags}
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

[env:esp32]
extends = esp32_base
board = esp32dev

[env:esp32s3]
extends = esp32_base
board = esp32-s3-devkitc-1

; ---- Host simulator ----
; Builds the sketch for this computer with the official Adafruit GFX and
; NeoMatrix libraries. Only Adafruit NeoPixel (the hardware driver) is
; replaced by lib/ArduinoSim, which records each show() as a frame.

[env:native]
platform = native
lib_ignore =
    Adafruit NeoPixel
    Adafruit BusIO
lib_compat_mode = off
extra_scripts = pre:scripts/skip_display_drivers.py
build_flags =
    -std=gnu++17
    -DPIXELART_SIM
    -DARDUINO=10819
    ; The simulator's Arduino core has no Stream/Printable: keep ArduinoJson to plain C++
    -DARDUINOJSON_ENABLE_ARDUINO_STRING=0
    -DARDUINOJSON_ENABLE_ARDUINO_STREAM=0
    -DARDUINOJSON_ENABLE_ARDUINO_PRINT=0
; Tests run in their own env, so they never overwrite the simulator program
test_ignore = *

; Tests in test/, run on the simulator (pio test -e native_test)
[env:native_test]
extends = env:native
test_ignore =
test_build_src = yes
build_flags =
    ${env:native.build_flags}
    '-DPIXELART_PROJECT_DIR="$PROJECT_DIR"'
